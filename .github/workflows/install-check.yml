# Runs the published one-line install on a clean machine. Start it by hand after a
# release: gh workflow run install-check.yml
name: Install check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-liner:
    runs-on: ubuntu-latest
    steps:
      - name: Install the latest release the way the README says
        run: |
          set -eux
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo sh | tee out.txt
          grep -qx 'status=installed' out.txt
          grep -q '^version=v' out.txt
          curl -fsS http://127.0.0.1:21114/healthz
